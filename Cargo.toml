[workspace]
resolver = "2"
exclude = ["std-examples"] # own workspace: std target
members = [
    "crates/ps5-sys",
    "crates/ps5",
    "examples/hello_notify",
    "examples/hwinfo",
    "examples/http_test",
    "examples/http_server", "examples/threads",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
ps5-sys = { path = "crates/ps5-sys" }
ps5 = { path = "crates/ps5" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = false
